<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes Enterprise AI Workspace architecture</title><style>body{margin:0;background:#faf9f6;color:#252925;font:15px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:24px}main{max-width:1000px;margin:auto}a{color:#285b40}svg{display:block;width:100%;min-width:720px;font-family:inherit}.figure{overflow:auto}h1{font-size:26px;line-height:1.3}</style></head><body><main><a href="./">← Back to case study</a><h1>Hermes Enterprise AI Workspace</h1><p>Simplified public architecture. Dashed connections show supporting dependencies.</p><div class="figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 664" role="img" aria-labelledby="hermes-title hermes-desc"><title id="hermes-title">Hermes Enterprise AI Workspace</title><desc id="hermes-desc">Architecture showing Enterprise portal, Backend-for-frontend, Agent runtime, Conversation context, Portal records, Knowledge service and their connections.</desc><defs><marker id="hermes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#656b63"/></marker><marker id="hermes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#285b40"/></marker><marker id="hermes-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#285b40"/></marker></defs><rect width="860" height="664" fill="#faf9f6"/><path d="M192 148 V192" fill="none" stroke="#656b63" stroke-width="1.5" marker-end="url(#hermes-arrow)"/><path d="M192 292 V336" fill="none" stroke="#656b63" stroke-width="1.5" marker-end="url(#hermes-arrow)"/><path d="M192 436 V480" fill="none" stroke="#656b63" stroke-width="1.5" marker-end="url(#hermes-arrow)"/><path d="M504 244 H416 Q408 244 408 236 V240 Q408 232 400 232 H352" fill="none" stroke="#656b63" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#hermes-arrow)"/><path d="M352 268 H424 Q432 268 432 276 V380 Q432 388 440 388 H504" fill="none" stroke="#656b63" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#hermes-arrow)"/><g><rect x="32" y="48" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="48" y="76" font-size="16" font-weight="600" fill="#252925">Enterprise portal</text><text x="48" y="100" font-size="11" fill="#285b40">Next.js</text><text x="48" y="126" font-size="11" fill="#656b63">Configure agents and open conversations</text></g><g><rect x="32" y="192" width="320" height="100" rx="6" fill="#edf1e9" stroke="#285b40"/><text x="48" y="220" font-size="16" font-weight="600" fill="#252925">Backend-for-frontend</text><text x="48" y="244" font-size="11" fill="#285b40">FastAPI / ownership checks</text><text x="48" y="270" font-size="11" fill="#656b63">Keep credentials server-side and proxy SSE</text></g><g><rect x="32" y="336" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="48" y="364" font-size="16" font-weight="600" fill="#252925">Agent runtime</text><text x="48" y="388" font-size="11" fill="#285b40">Hermes API</text><text x="48" y="414" font-size="11" fill="#656b63">Execute the selected agent team</text></g><g><rect x="32" y="480" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="48" y="508" font-size="16" font-weight="600" fill="#252925">Conversation context</text><text x="48" y="532" font-size="11" fill="#285b40">Honcho memory</text><text x="48" y="558" font-size="11" fill="#656b63">Provide persistent memory context</text></g><g><rect x="504" y="192" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="520" y="220" font-size="16" font-weight="600" fill="#252925">Portal records</text><text x="520" y="244" font-size="11" fill="#285b40">SQLite</text><text x="520" y="270" font-size="11" fill="#656b63">Map users to sessions and agent versions</text></g><g><rect x ="16" font-weight="600" fill="#252925">Agent definition</text><text x="48" y="100" font-size="11" fill="#285b40">Persona / configuration</text><text x="48" y="126" font-size="11" fill="#656b63">Create a configuration in the workspace</text></g><g><rect x="32" y="192" width="320" height="100" rx="6" fill="#edf1e9" stroke="#285b40"/><text x="48" y="220" font-size="16" font-weight="600" fill="#252925">Validation</text><text x="48" y="244" font-size="11" fill="#285b40">Factory checks</text><text x="48" y="270" font-size="11" fill="#656b63">Check the configuration before publishing</text></g><g><rect x="32" y="336" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="48" y="364" font-size="16" font-weight="600" fill="#252925">Published version</text><text x="48" y="388" font-size="11" fill="#285b40">Version lifecycle</text><text x="48" y="414" font-size="11" fill="#656b63">Make a version available for selection</text></g><g><rect x="32" y="480" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="48" y="508" font-size="16" font-weight="600" fill="#252925">Runtime team selection</text><text x="48" y="532" font-size="11" fill="#285b40">Conversation setup</text><text x="48" y="558" font-size="11" fill="#656b63">Select agents; publishing does not start chat</text></g><path d="M32 612 H824" stroke="#dddfd7"/><text x="32" y="640" font-size="11" fill="#656b63">Solid: primary flow · Dashed: supporting dependency</text></svg></div><p>Internal deployment details are omitted. See the case study for implementation status and limitations.</p></main></body></html>
