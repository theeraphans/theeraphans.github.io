<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOC Inquiry Intelligence architecture</title><style>body{margin:0;background:#faf9f6;color:#252925;font:15px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:24px}main{max-width:1000px;margin:auto}a{color:#285b40}svg{display:block;width:100%;min-width:720px;font-family:inherit}.figure{overflow:auto}h1{font-size:26px;line-height:1.3}</style></head><body><main><a href="./">← Back to case study</a><h1>VOC Inquiry Intelligence</h1><p>Simplified public architecture. Dashed connections show supporting dependencies.</p><div class="figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 664" role="img" aria-labelledby="voc-title voc-desc"><title id="voc-title">VOC Inquiry Intelligence</title><desc id="voc-desc">Architecture showing Customer messages, Preparation &amp; analysis, Review portal, Business reporting, Inquiry definitions, Execution traces and their connections.</desc><defs><marker id="voc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#656b63"/></marker><marker id="voc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#285b40"/></marker><marker id="voc-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#285b40"/></marker></defs><rect width="860" height="664" fill="#faf9f6"/><path d="M192 148 V192" fill="none" stroke="#656b63" stroke-width="1.5" marker-end="url(#voc-arrow)"/><path d="M192 292 V336" fill="none" stroke="#656b63" stroke-width="1.5" marker-end="url(#voc-arrow)"/><path d="M192 436 V480" fill="none" stroke="#656b63" stroke-width="1.5" marker-end="url(#voc-arrow)"/><path d="M504 244 H416 Q408 244 408 236 V240 Q408 232 400 232 H352" fill="none" stroke="#656b63" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#voc-arrow)"/><path d="M352 268 H424 Q432 268 432 276 V380 Q432 388 440 388 H504" fill="none" stroke="#656b63" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#voc-arrow)"/><g><rect x="32" y="48" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="48" y="76" font-size="16" font-weight="600" fill="#252925">Customer messages</text><text x="48" y="100" font-size="11" fill="#285b40">Email / recorded calls</text><text x="48" y="126" font-size="11" fill="#656b63">Capture the original customer inquiry</text></g><g><rect x="32" y="192" width="320" height="100" rx="6" fill="#edf1e9" stroke="#285b40"/><text x="48" y="220" font-size="16" font-weight="600" fill="#252925">Preparation &amp; analysis</text><text x="48" y="244" font-size="11" fill="#285b40">Azure OpenAI / orchestration</text><text x="48" y="270" font-size="11" fill="#656b63">Transcribe calls and classify the message</text></g><g><rect x="32" y="336" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="48" y="364" font-size="16" font-weight="600" fill="#252925">Review portal</text><text x="48" y="388" font-size="11" fill="#285b40">Human review</text><text x="48" y="414" font-size="11" fill="#656b63">Check inquiry type and urgent cases</text></g><g><rect x="32" y="480" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="48" y="508" font-size="16" font-weight="600" fill="#252925">Business reporting</text><text x="48" y="532" font-size="11" fill="#285b40">CRM / Power BI</text><text x="48" y="558" font-size="11" fill="#656b63">Deliver reviewed data to operations</text></g><g><rect x="504" y="192" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="520" y="220" font-size="16" font-weight="600" fill="#252925">Inquiry definitions</text><text x="520" y="244" font-size="11" fill="#285b40">LlamaIndex / Milvus</text><text x="520" y="270" font-size="11" fill="#656b63">Retrieve context for classification</text></g><g><rect x="504" y="336" width="320" height="100" rx="6" fill="#ffffff" stroke="#656b63"/><text x="520" y="364" font-size="16" font-weight="600" fill="#252925">Execution traces</text><text x="520" y="388" font-size="11" fill="#285b40">LangFuse</text><text x="520" y="414" font-size="11" fill="#656b63">Inspect the analysis workflow</text></g><path d="M32 612 H824" stroke="#dddfd7"/><text x="32" y="640" font-size="11" fill="#656b63">Solid: primary flow · Dashed: supporting dependency</text></svg></div><p>Internal deployment details are omitted. See the case study for implementation status and limitations.</p></main></body></html>
